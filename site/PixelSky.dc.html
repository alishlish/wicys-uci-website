<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;overflow:hidden;pointerEvents:none">

  <!-- dense pixel dot-grid texture (flyer background) -->
  <canvas ref="{{ gridRef }}" style="position:absolute;left:0;top:0;width:100%;height:100%;imageRendering:pixelated"></canvas>

  <!-- 8-bit sprite layer: pixel saturns, planets, moons, star crosses -->
  {{ sprites }}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:600}}">
const ART = {
  saturnBody: [
    "......####......",
    "....########....",
    "...##########...",
    "..############..",
    "..############..",
    ".##############.",
    ".##############.",
    "################",
    "################",
    ".##############.",
    ".##############.",
    "..############..",
    "..############..",
    "...##########...",
    "....########....",
    "......####......"
  ],
  saturnRing: [
    "####....................",
    "####################....",
    "....####################",
    "....................####"
  ],
  planet: [
    "..####..",
    ".######.",
    "########",
    "########",
    "########",
    "########",
    ".######.",
    "..####.."
  ],
  crater: [
    "....##..",
    "........",
    "..#...##",
    "........",
    "##...#..",
    "........",
    "...##...",
    "........"
  ],
  moon: [
    "..##....",
    ".##.....",
    "##......",
    "##......",
    "##......",
    "##......",
    ".##.....",
    "..##...."
  ],
  star3: [
    ".#.",
    "###",
    ".#."
  ],
  star5: [
    "..#..",
    "..#..",
    "#####",
    "..#..",
    "..#.."
  ],
  dot: ["#"]
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.grid = React.createRef();
    this.paint = this.paint.bind(this);
  }

  componentDidMount() {
    this.paint();
    window.addEventListener("resize", this.paint);
    this.repaint = setInterval(this.paint, 1200);
  }

  componentWillUnmount() {
    window.removeEventListener("resize", this.paint);
    clearInterval(this.repaint);
  }

  // dense flyer dot-grid, painted as real 1px pixels (no gradients, no scaling)
  paint() {
    const cv = this.grid.current;
    if (!cv) return;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const g = cv.getContext("2d");
    g.clearRect(0, 0, w, h);
    g.fillStyle = "#ded5ee";
    for (let y = 0; y < h; y += 4) for (let x = 0; x < w; x += 4) g.fillRect(x, y, 1, 1);
    g.fillStyle = "#c6b6e2";
    for (let y = 0; y < h; y += 16) for (let x = 0; x < w; x += 16) g.fillRect(x, y, 1, 1);
    g.fillStyle = "rgba(109,63,168,0.3)";
    for (let y = 8; y < h; y += 48) for (let x = 8; x < w; x += 64) g.fillRect(x, y, 2, 2);
  }

  sprite(art, unit, color, key, style) {
    const shadows = [];
    for (let y = 0; y < art.length; y++) {
      for (let x = 0; x < art[y].length; x++) {
        if (art[y][x] === "#") shadows.push((x * unit) + "px " + (y * unit) + "px 0 0 " + color);
      }
    }
    return React.createElement("div", {
      key: key,
      style: Object.assign({
        position: "absolute",
        width: unit + "px",
        height: unit + "px",
        boxShadow: shadows.join(","),
        imageRendering: "pixelated"
      }, style || {})
    });
  }

  saturn(key, unit, left, top, bodyColor, ringColor, opacity, dur, delay) {
    return React.createElement("div", {
      key: key,
      style: {
        position: "absolute",
        left: left,
        top: top,
        opacity: opacity,
        animation: "sky-float " + dur + "s ease-in-out infinite " + delay + "s"
      }
    }, [
      this.sprite(ART.saturnBody, unit, bodyColor, "b", { left: (4 * unit) + "px", top: "0px" }),
      this.sprite(ART.saturnRing, unit, ringColor, "r", { left: "0px", top: (7 * unit) + "px" })
    ]);
  }

  planet(key, unit, left, top, color, craterColor, opacity, dur, delay) {
    return React.createElement("div", {
      key: key,
      style: {
        position: "absolute",
        left: left,
        top: top,
        opacity: opacity,
        animation: "sky-float " + dur + "s ease-in-out infinite " + delay + "s"
      }
    }, [
      this.sprite(ART.planet, unit, color, "p", { left: 0, top: 0 }),
      this.sprite(ART.crater, unit, craterColor, "c", { left: 0, top: 0 })
    ]);
  }

  renderVals() {
    const kids = [];

    // --- pixel saturns + planets (9) ---
    kids.push(this.saturn("s1", 5, "78%", "4%", "#c0a8e0", "#a888d4", 0.6, 26, 0));
    kids.push(this.saturn("s2", 3, "3%", "26%", "#c8b6e4", "#ae90d8", 0.5, 32, 3));
    kids.push(this.saturn("s3", 4, "88%", "60%", "#c4b0e2", "#ab8cd6", 0.5, 29, 6));
    kids.push(this.saturn("s4", 3, "34%", "97%", "#ccbbe8", "#b295dc", 0.42, 35, 2));
    kids.push(this.planet("p1", 4, "2%", "6%", "#b79ddd", "#9878c8", 0.5, 24, 1));
    kids.push(this.planet("p2", 3, "62%", "23%", "#c4b0e2", "#9d7fcb", 0.35, 30, 4));
    kids.push(this.planet("p3", 5, "94%", "88%", "#bda4e0", "#3a2f4d", 0.45, 27, 2));
    kids.push(this.planet("p4", 3, "92%", "34%", "#c8b6e4", "#a184ce", 0.4, 33, 5));
    kids.push(this.planet("p5", 4, "5%", "92%", "#c0a8e0", "#9b7cc9", 0.45, 25, 7));

    // --- pixel moons (4) ---
    const moons = [
      ["m1", 4, "45%", "3%", 0.55, 22, 0],
      ["m2", 3, "84%", "78%", 0.45, 28, 3],
      ["m3", 5, "7%", "54%", 0.4, 31, 6],
      ["m4", 3, "70%", "43%", 0.4, 20, 1]
    ];
    moons.forEach(function (m) {
      kids.push(this.sprite(ART.moon, m[1], "#8f6dc4", m[0], {
        left: m[2], top: m[3], opacity: m[4],
        animation: "sky-float " + m[5] + "s ease-in-out infinite " + m[6] + "s"
      }));
    }, this);

    // --- pixel star crosses (24, twinkling) ---
    const stars = [
      [4, "4%", "5%", 0], [3, "15%", "22%", 1.2], [5, "29%", "9%", 2.4],
      [3, "41%", "18%", 0.6], [4, "55%", "4%", 3.1], [3, "67%", "16%", 1.8],
      [5, "81%", "22%", 0.3], [3, "94%", "12%", 2.7], [4, "11%", "44%", 1.5],
      [3, "24%", "36%", 3.4], [5, "36%", "48%", 0.9], [3, "49%", "38%", 2.1],
      [4, "61%", "52%", 1.1], [3, "74%", "36%", 3.7], [5, "93%", "48%", 0.4],
      [3, "6%", "88%", 2.9], [4, "19%", "74%", 1.7], [3, "31%", "94%", 0.7],
      [5, "44%", "66%", 3.3], [3, "57%", "78%", 2.2], [4, "71%", "68%", 0.5],
      [3, "84%", "92%", 1.9], [5, "96%", "70%", 2.6], [3, "50%", "58%", 1.4]
    ];
    stars.forEach(function (s, i) {
      const art = s[0] >= 5 ? ART.star5 : ART.star3;
      const unit = s[0] >= 5 ? 3 : 2;
      kids.push(this.sprite(art, unit, i % 3 === 0 ? "#7a52b8" : "#9a7bce", "st" + i, {
        left: s[1], top: s[2],
        animation: "sky-tw " + (3 + (i % 5)) + "s steps(2, end) infinite " + s[3] + "s"
      }));
    }, this);

    // --- single-pixel far stars ---
    const dots = [
      ["9%", "16%"], ["22%", "62%"], ["34%", "28%"], ["46%", "88%"], ["58%", "42%"],
      ["66%", "74%"], ["76%", "10%"], ["88%", "64%"], ["97%", "34%"], ["14%", "96%"],
      ["27%", "78%"], ["39%", "56%"], ["52%", "24%"], ["63%", "6%"], ["79%", "56%"],
      ["91%", "20%"], ["3%", "56%"], ["43%", "72%"]
    ];
    dots.forEach(function (d, i) {
      kids.push(this.sprite(ART.dot, i % 2 ? 2 : 3, "#b9a5d8", "d" + i, {
        left: d[0], top: d[1],
        animation: "sky-tw " + (4 + (i % 4)) + "s steps(2, end) infinite " + (i % 6) * 0.7 + "s"
      }));
    }, this);

    return { gridRef: this.grid, sprites: React.createElement("div", { style: { position: "absolute", inset: 0, opacity: 0.8, animation: "sky-drift 160s linear infinite alternate" } }, kids) };
  }
}
</script>
</body>
</html>
